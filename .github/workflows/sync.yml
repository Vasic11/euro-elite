# Manual sync: the "Run workflow" button in the Actions tab calls /api/cron/sync.
# Scheduled syncs run on Vercel Schedules (vercel.json): hourly 18:05–23:05 UTC
# and 04:00 UTC. The GitHub cron was dropped because it skipped most evening runs.
#
# Needs the CRON_SECRET secret (same value as on Vercel):
#   gh secret set CRON_SECRET
name: Manual sync

on:
  workflow_dispatch:

# Never two syncs at once; a new one waits for the previous to finish.
concurrency:
  group: sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://euro-elite.vercel.app/api/cron/sync
