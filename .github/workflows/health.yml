# Svako jutro proverava da li sajt i dalje dobija ispravne podatke od EuroLeague API-ja.
# Ako /api/health ne vrati 200, ovaj workflow padne i GitHub ti pošalje email.
name: API health

on:
  schedule:
    - cron: "17 6 * * *" # svaki dan u 06:17 UTC (07:17 po beogradskom zimskom vremenu)
  workflow_dispatch: # dugme "Run workflow" za ručno pokretanje

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        run: curl --fail-with-body --silent --show-error --max-time 60 https://euro-elite.vercel.app/api/health
